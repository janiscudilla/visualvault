  font-family: 'DM Sans', system-ui, sans-serif;
  color: #f8f2ec;
  background: #120e14;
  font-synthesis: none;
  --bg: #120e14;
  --surface: #1c151f;
  --surface-2: #251c29;
  --surface-3: #2d2231;
  --border: #3a2d3e;
  --text: #f8f2ec;
  --muted: #b3a5b8;
  --faint: #766a7c;
  --gold: #e6ad58;
  --gold-soft: #f5cf8e;
  --plum: #70435c;
  --danger: #ee937d;
  --shadow: 0 24px 70px rgba(0, 0, 0, .38);
}

* { box-sizing: border-box; }

html { min-width: 320px; background: var(--bg); }

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background:
    radial-gradient(circle at 15% -10%, rgba(112, 67, 92, .22), transparent 38rem),
    radial-gradient(circle at 90% 0%, rgba(230, 173, 88, .08), transparent 28rem),
    var(--bg);
}

button, input, select, textarea { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
button:disabled { opacity: .55; cursor: not-allowed; }

.app-shell { min-height: 100vh; }
.modal-open { overflow: hidden; }

.topbar {
  position: sticky;
  z-index: 20;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1.15rem clamp(1rem, 3vw, 2.5rem);
  border-bottom: 1px solid rgba(82, 65, 87, .75);
  background: rgba(18, 14, 20, .86);
  backdrop-filter: blur(18px);
}

.brand { display: flex; align-items: center; gap: .8rem; min-width: 0; }
.brand-mark {
  display: grid;
  width: 2.8rem;
  height: 2.8rem;
  flex: 0 0 auto;
  place-items: center;
  color: #211519;
  border-radius: .8rem;
  background: linear-gradient(145deg, var(--gold-soft), var(--gold));
  box-shadow: inset 0 1px rgba(255,255,255,.5), 0 9px 24px rgba(230,173,88,.15);
}

.brand h1, .locked-screen h1, .modal h2, .empty-state h2 {
  margin: 0;
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
}
.brand h1 { font-size: clamp(1.3rem, 2.2vw, 1.75rem); line-height: 1.05; }
.brand p { margin: .25rem 0 0; color: var(--muted); font-size: .78rem; font-style: italic; }
.header-actions { display: flex; align-items: center; gap: .6rem; }
.header-menu-wrap { position: relative; }
.header-menu { position: absolute; z-index: 80; top: calc(100% + .55rem); right: 0; display: grid; width: 13rem; padding: .4rem; border: 1px solid var(--border); border-radius: .85rem; background: rgba(37,28,41,.98); box-shadow: 0 18px 45px rgba(0,0,0,.48); }
.header-menu button { display: flex; min-height: 2.55rem; padding: .65rem .75rem; align-items: center; gap: .45rem; border: 0; border-radius: .6rem; color: var(--text); background: transparent; cursor: pointer; font-size: .78rem; text-align: left; }
.header-menu button:hover { color: #24160d; background: var(--gold); }

.primary-button, .secondary-button, .quiet-button, .delete-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .45rem;
  min-height: 2.6rem;
  padding: .68rem 1rem;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 700;
  font-size: .86rem;
}
.primary-button { color: #24160d; border: 1px solid #f0bf70; background: linear-gradient(180deg, #f2bd69, #dea04a); box-shadow: 0 8px 24px rgba(230,173,88,.13); }
.primary-button:hover { filter: brightness(1.05); transform: translateY(-1px); }
.secondary-button { border: 1px solid var(--border); background: var(--surface-2); }
.secondary-button:hover, .quiet-button:hover { background: var(--surface-3); }
.quiet-button { color: var(--muted); border: 1px solid var(--border); background: transparent; }
.delete-button { color: var(--danger); border: 1px solid rgba(238,147,125,.3); background: transparent; }
.icon-button {
  display: grid;
  width: 2.55rem;
  height: 2.55rem;
  padding: 0;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface-2);
  cursor: pointer;
}
.icon-button:hover { background: var(--surface-3); }
.demo-pill { padding: .4rem .7rem; border: 1px solid rgba(230,173,88,.3); border-radius: 999px; color: var(--gold-soft); background: rgba(230,173,88,.1); font-size: .75rem; }

main { width: min(1240px, calc(100% - 2rem)); margin: 0 auto; padding: 1.5rem 0 4rem; }

.inline-uploader { scroll-margin-top: 6rem; margin-bottom: 2rem; border: 1px solid rgba(230,173,88,.28); border-radius: 1.35rem; background: var(--surface); box-shadow: 0 24px 70px rgba(0,0,0,.3), inset 0 1px rgba(255,255,255,.03); overflow: hidden; }
.modal-heading.inline-upload-heading { position: static; padding: 1.35rem 1.5rem; align-items: center; background: linear-gradient(115deg, rgba(112,67,92,.2), rgba(230,173,88,.055)); }
.modal-heading.inline-upload-heading h2 { font-size: clamp(1.75rem, 4vw, 2.5rem); }
.upload-heading-copy { max-width: 42rem; margin: .45rem 0 0; color: var(--muted); font-size: .82rem; line-height: 1.5; }
.editor-layout.upload-only { grid-template-columns: 1fr; }
.editor-layout.upload-only .image-editor { border-right: 0; }
.inline-uploader .image-editor { background: linear-gradient(145deg, #171119, #130f15); }
.inline-uploader .drop-zone, .inline-uploader .url-panel { min-height: 20rem; }
.inline-uploader .drop-zone { border-width: 2px; background: radial-gradient(circle at 50% 15%, rgba(230,173,88,.08), transparent 17rem), rgba(112,67,92,.07); }
.inline-uploader .drop-zone:hover { border-color: var(--gold); color: var(--gold-soft); background: rgba(230,173,88,.075); }
.inline-uploader .drop-zone svg { width: 2.3rem; height: 2.3rem; color: var(--gold); }
.inline-uploader .drop-zone strong { font-family: 'Fraunces', Georgia, serif; font-size: 1.35rem; }
.upload-error { width: min(36rem, 100%); margin: .8rem auto 0; }
.collection-heading { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin: 0 0 .8rem; padding: .4rem .2rem 0; }
.collection-heading h2 { margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 1.6rem; }
.collection-heading > p { margin: 0 0 .1rem; color: var(--muted); font-size: .76rem; }
.summary-row.collection-summary { grid-template-columns: repeat(4, minmax(72px, 100px)) minmax(160px, 1fr); gap: .5rem; }
.collection-summary .stat, .collection-summary .favorite-stat { min-height: 3.7rem; padding: .65rem .8rem; }
.collection-summary .stat strong { font-size: 1.2rem; }
.collection-summary .favorite-stat strong { font-size: .95rem; }

.summary-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(85px, 130px)) minmax(180px, 1fr);
  gap: .7rem;
  margin-bottom: 1rem;
}
.stat, .favorite-stat {
  min-height: 5rem;
  padding: .85rem 1rem;
  border: 1px solid var(--border);
  border-radius: 1rem;
  background: linear-gradient(145deg, rgba(37,28,41,.92), rgba(28,21,31,.92));
}
.stat { display: flex; flex-direction: column; justify-content: center; }
.stat strong { color: var(--gold-soft); font-family: 'Fraunces', serif; font-size: 1.55rem; font-weight: 600; line-height: 1; }
.stat span, .favorite-stat span { margin-top: .3rem; color: var(--muted); font-size: .76rem; }
.favorite-stat { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; text-align: right; }
.favorite-stat strong { margin-top: .25rem; font-family: 'Fraunces', serif; font-size: 1.05rem; }

.controls { padding: .8rem; border: 1px solid var(--border); border-radius: 1.15rem; background: rgba(28,21,31,.8); box-shadow: 0 12px 35px rgba(0,0,0,.12); }
.search-box {
  display: flex;
  align-items: center;
  gap: .65rem;
  min-height: 3rem;
  padding: 0 .9rem;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: .8rem;
  background: var(--surface-2);
}
.search-box:focus-within { border-color: rgba(230,173,88,.65); box-shadow: 0 0 0 3px rgba(230,173,88,.08); }
.search-box input { width: 100%; border: 0; outline: 0; color: var(--text); background: transparent; font-size: .95rem; }
.search-box input::placeholder { color: #8d8091; }
.search-box button { display: grid; padding: .25rem; border: 0; color: var(--muted); background: transparent; cursor: pointer; }

.control-row { display: flex; align-items: center; gap: .6rem; margin-top: .7rem; }
.filter-button, .sort-control, .arrange-button, .view-switcher, .size-switcher { border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); }
.filter-button { display: inline-flex; align-items: center; gap: .4rem; min-height: 2.4rem; padding: .55rem .85rem; cursor: pointer; }
.filter-button.active { border-color: rgba(230,173,88,.45); }
.filter-button b { display: grid; width: 1.25rem; height: 1.25rem; place-items: center; border-radius: 50%; color: #24160d; background: var(--gold); font-size: .7rem; }
.arrange-button { display: inline-flex; min-height: 2.4rem; padding: .55rem .85rem; align-items: center; justify-content: center; gap: .4rem; color: var(--text); cursor: pointer; font-size: .78rem; font-weight: 700; }
.arrange-button.active { color: #24160d; border-color: #f0bf70; background: var(--gold); }
.sort-control { display: flex; align-items: center; gap: .35rem; min-height: 2.4rem; padding: 0 .35rem 0 .75rem; color: var(--muted); }
.sort-control select, .filter-select select { border: 0; outline: 0; color: var(--text); background: transparent; cursor: pointer; }
.sort-control select { min-height: 2.2rem; padding: 0 1.3rem 0 .2rem; font-size: .82rem; }
.sort-control option, .filter-select option, .metadata-form option { color: var(--text); background: var(--surface-2); }
.size-switcher { display: flex; margin-left: auto; padding: .2rem; }
.view-switcher { display: flex; padding: .2rem; }
.view-switcher button, .size-switcher button { display: inline-flex; align-items: center; justify-content: center; gap: .35rem; min-height: 2rem; padding: .42rem .7rem; border: 0; border-radius: 999px; color: var(--muted); background: transparent; cursor: pointer; font-size: .78rem; }

.crop-help { margin: .65rem 0 0; color: var(--muted); font-size: .69rem; text-align: center; }

.crop-modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; padding: .85rem 1.15rem 1.15rem; border-top: 1px solid var(--border); }
.crop-modal-actions > button { justify-content: center; }
.metadata-form { display: flex; padding: 1.35rem; flex-direction: column; gap: 1rem; }
.batch-shared-note { margin: 0; padding: .7rem .8rem; border: 1px solid rgba(230,173,88,.25); border-radius: .7rem; color: var(--gold-soft); background: rgba(230,173,88,.07); font-size: .74rem; line-height: 1.45; }
.metadata-form > label { display: grid; gap: .4rem; }
.metadata-form > label > span, .autocomplete-field > label > span, .multi-value-field > label > span, .url-panel label span { color: var(--muted); font-size: .78rem; }
.metadata-form b { color: var(--gold); }
.metadata-form small { color: var(--faint); font-size: .7rem; }
.metadata-form input, .metadata-form select, .metadata-form textarea, .url-panel input { padding: .72rem .8rem; border: 1px solid var(--border); border-radius: .7rem; outline: 0; color: var(--text); background: var(--surface-2); font-size: .92rem; }
.metadata-form textarea { resize: vertical; line-height: 1.5; }
.metadata-form input:focus, .metadata-form select:focus, .metadata-form textarea:focus, .url-panel input:focus { border-color: rgba(230,173,88,.6); }
.autocomplete-field { display: grid; gap: .4rem; }
.autocomplete-control { position: relative; }
.autocomplete-control input { width: 100%; }
.autocomplete-menu { position: absolute; z-index: 30; top: calc(100% + .35rem); right: 0; left: 0; display: grid; max-height: 14rem; padding: .35rem; border: 1px solid #59465e; border-radius: .75rem; background: #2a202d; box-shadow: 0 16px 36px rgba(0,0,0,.48); overflow-y: auto; }
.autocomplete-menu button { min-height: 2.65rem; padding: .65rem .75rem; border: 0; border-radius: .55rem; color: var(--text); background: transparent; cursor: pointer; font: inherit; text-align: left; }
.autocomplete-menu button:hover, .autocomplete-menu button:focus-visible { color: #27170d; background: var(--gold); outline: 0; }
.multi-value-field { display: grid; gap: .4rem; }
.multi-value-control { position: relative; display: grid; grid-template-columns: 1fr auto; gap: .4rem; }
.multi-value-control input { width: 100%; min-width: 0; }
.add-value-button { display: grid; width: 2.7rem; padding: 0; place-items: center; border: 1px solid var(--border); border-radius: .7rem; color: var(--gold-soft); background: var(--surface-2); cursor: pointer; }
.add-value-button:hover { border-color: rgba(230,173,88,.55); background: var(--surface-3); }
.multi-value-control .autocomplete-menu { right: 3.1rem; }
.value-chips, .detail-chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.value-chips > span, .detail-chips > span { display: inline-flex; min-height: 1.75rem; padding: .3rem .55rem; align-items: center; gap: .25rem; border: 1px solid rgba(180,154,185,.22); border-radius: 999px; color: #e7dce9; background: rgba(112,67,92,.2); font-size: .72rem; }
.value-chips button { display: grid; width: 1.1rem; height: 1.1rem; padding: 0; place-items: center; border: 0; border-radius: 50%; color: var(--muted); background: transparent; cursor: pointer; }
.value-chips button:hover { color: white; background: rgba(255,255,255,.1); }
.form-error { margin: 0; padding: .7rem .8rem; border-radius: .6rem; color: #ffd3c9; background: rgba(238,147,125,.1); font-size: .78rem; }
.upload-progress { position: relative; height: 1.7rem; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.upload-progress span { position: absolute; inset: 0 auto 0 0; background: rgba(230,173,88,.35); }
.upload-progress small { position: relative; z-index: 1; display: grid; height: 100%; place-items: center; font-size: .7rem; }
.form-actions { display: flex; align-items: center; gap: .55rem; margin-top: auto; padding-top: .4rem; }
.action-spacer { flex: 1; }
.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.detail-modal { display: grid; grid-template-columns: minmax(280px, 1.05fr) minmax(250px, .75fr); width: min(820px, 100%); overflow: hidden; }
.detail-image { min-height: min(70vh, 670px); background: #0c090d; }
.detail-copy { position: relative; display: flex; padding: 2rem; flex-direction: column; justify-content: center; }
.detail-copy .icon-button { position: absolute; top: 1rem; right: 1rem; }
.detail-copy h2 { font-size: clamp(1.8rem, 5vw, 2.8rem); line-height: 1; }
.detail-group { margin: .55rem 0 0; color: var(--gold-soft); }
.detail-event { margin: .45rem 0 0; color: var(--muted); font-size: .82rem; }
.detail-date { margin: .45rem 0 .2rem; color: var(--muted); font-size: .78rem; }
.detail-meta { display: grid; gap: .35rem; margin-top: .75rem; }
.detail-meta > strong { color: var(--faint); font-size: .65rem; letter-spacing: .08em; text-transform: uppercase; }
.detail-chips.folders > span { color: var(--gold-soft); border-color: rgba(230,173,88,.25); background: rgba(230,173,88,.08); }
.detail-note { margin: 1.5rem 0; color: var(--muted); line-height: 1.6; }
.photo-updated { margin: .8rem 0 0; color: var(--faint); font-size: .7rem; }
.edit-detail { align-self: flex-start; margin-top: .5rem; }

.manage-lists-modal { width: min(760px, 100%); }
.manage-lists-body { display: grid; padding: 1.25rem 1.35rem 1.5rem; gap: 1rem; }
.manage-kind { display: grid; gap: .4rem; }
.manage-kind span { color: var(--muted); font-size: .75rem; }
.manage-kind select, .manage-value-input input { width: 100%; min-height: 2.7rem; padding: .65rem .75rem; border: 1px solid var(--border); border-radius: .7rem; outline: 0; color: var(--text); background: var(--surface-2); }
.manage-kind select:focus, .manage-value-input input:focus { border-color: rgba(230,173,88,.6); }
.manage-kind option { color: var(--text); background: var(--surface-2); }
.manage-help { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.5; }
.manage-value-list { display: grid; gap: .55rem; max-height: min(56vh, 34rem); padding-right: .2rem; overflow-y: auto; }
.manage-value-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: .5rem; align-items: end; padding: .65rem; border: 1px solid var(--border); border-radius: .8rem; background: rgba(37,28,41,.55); }
.manage-value-input { display: grid; min-width: 0; gap: .25rem; }
.manage-value-input small { color: var(--faint); font-size: .66rem; }
.manage-value-row .secondary-button { min-height: 2.7rem; padding: .6rem .8rem; }
.delete-list-value { display: inline-flex; min-height: 2.7rem; padding: .6rem .75rem; align-items: center; justify-content: center; gap: .35rem; border: 1px solid rgba(238,147,125,.28); border-radius: 999px; color: var(--danger); background: transparent; cursor: pointer; font-size: .76rem; font-weight: 700; }
.delete-list-value:disabled { color: var(--faint); border-color: var(--border); cursor: not-allowed; }
.manage-empty { margin: 1rem 0; color: var(--muted); text-align: center; }

.locked-screen { display: flex; width: min(520px, calc(100% - 2rem)); min-height: 100vh; margin: 0 auto; padding: 3rem 1rem; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.locked-folder { display: grid; width: 6.3rem; height: 6.3rem; margin-bottom: 1.35rem; place-items: center; border: 1px solid rgba(230,173,88,.36); border-radius: 1.7rem; color: var(--gold); background: linear-gradient(145deg, rgba(230,173,88,.14), rgba(112,67,92,.16)); box-shadow: 0 25px 70px rgba(0,0,0,.34); }
.locked-screen h1 { font-size: clamp(2.7rem, 10vw, 4.5rem); line-height: .95; }
.locked-screen > p:not(.eyebrow):not(.form-error) { max-width: 27rem; color: var(--muted); line-height: 1.55; }
.sign-in-button { margin-top: 1.1rem; }
.setup-card { display: grid; width: 100%; margin-top: 1rem; padding: 1rem; gap: .55rem; border: 1px solid var(--border); border-radius: 1rem; color: var(--muted); background: var(--surface); font-size: .85rem; }
.setup-card strong { color: var(--text); }
.setup-card .secondary-button { margin: .3rem auto 0; }
.uid-copy code { word-break: break-all; }
.app-loading { display: grid; min-height: 100vh; place-items: center; align-content: center; gap: .7rem; color: var(--muted); }
.toast { position: fixed; z-index: 150; right: 1rem; bottom: 1rem; max-width: min(26rem, calc(100% - 2rem)); padding: .8rem 1rem; border: 1px solid rgba(230,173,88,.34); border-radius: .8rem; color: #fff2dc; background: rgba(42,31,39,.96); box-shadow: var(--shadow); font-size: .82rem; }

@media (max-width: 760px) {
  .topbar { align-items: flex-start; }
  .brand p { display: none; }
  .header-actions { gap: .4rem; }
  .add-button { width: 2.55rem; padding: 0; }
  .add-button svg { margin: 0; }
  .add-button { font-size: 0; }
  .demo-pill, .quiet-button { display: none; }
  main { width: min(100% - 1rem, 1240px); padding-top: .75rem; }
  .summary-row { grid-template-columns: repeat(3, 1fr); gap: .45rem; }
  .stat { min-height: 4rem; padding: .65rem; }
  .stat strong { font-size: 1.25rem; }
  .favorite-stat { grid-column: 1 / -1; min-height: 3.4rem; align-items: flex-start; text-align: left; }
  .favorite-stat strong { font-size: .95rem; }
  .inline-uploader { scroll-margin-top: 5rem; margin-bottom: 1.4rem; border-radius: 1rem; }
  .modal-heading.inline-upload-heading { position: static; padding: 1rem; background: linear-gradient(115deg, rgba(112,67,92,.2), rgba(230,173,88,.055)); }
  .modal-heading.inline-upload-heading h2 { font-size: 1.65rem; }
  .upload-heading-copy { font-size: .76rem; }
  .inline-uploader .drop-zone, .inline-uploader .url-panel { min-height: 17rem; }
  .collection-heading { align-items: flex-start; flex-direction: column; gap: .25rem; margin-top: .2rem; }
  .collection-heading > p { font-size: .7rem; }
  .summary-row.collection-summary { grid-template-columns: repeat(2, 1fr); }
  .collection-summary .favorite-stat { grid-column: 1 / -1; min-height: 3rem; }
  .control-row { flex-wrap: wrap; }
  .size-switcher { width: 100%; margin: .1rem 0 0; }
  .view-switcher { width: 100%; }
  .size-switcher button,
  .view-switcher button { flex: 1; justify-content: center; }
  .filter-drawer { grid-template-columns: 1fr; }
  .binder-page { padding: 1rem .65rem 1.55rem 1.4rem; }
  .binder-rings { left: -.45rem; }
  .binder-rings i { width: 1.4rem; }
  .pocket-grid { gap: .38rem; }
  .album-pocket { padding: .25rem; }
  .pocket-caption { padding: .38rem .05rem .08rem; }
  .pocket-caption strong { font-size: .68rem; }
  .pocket-caption small { font-size: .58rem; }
  .album-stack.density-comfortable .pocket-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .album-stack.density-compact .pocket-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .album-stack.density-comfortable .binder-page,
  .album-stack.density-compact .binder-page { padding: 1rem .65rem 1.55rem 1.4rem; }
  .empty-pocket { aspect-ratio: 4 / 6.1; }
  .instax-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: .75rem; gap: .48rem; }
  .instax-gallery.density-comfortable { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .42rem; padding: .65rem; }
  .instax-gallery.density-compact { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .35rem; padding: .5rem; }
  .folders-grid { grid-template-columns: 1fr; }
  .folders-grid.density-comfortable { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .55rem; }
  .folders-grid.density-compact { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .4rem; }
  .modal-backdrop { padding: 0; place-items: stretch; overflow: hidden; }
  .modal { width: 100%; height: 100dvh; max-height: 100dvh; border: 0; border-radius: 0; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .modal-heading { position: sticky; z-index: 50; top: 0; padding: .9rem 1rem; background: rgba(31,23,33,.94); backdrop-filter: blur(12px); }
  .modal-heading h2 { font-size: 1.35rem; }
  .editor-layout, .detail-modal { grid-template-columns: 1fr; }
  .image-editor { padding: 1rem; border-right: 0; border-bottom: 1px solid var(--border); }
  .drop-zone, .url-panel { min-height: 10.5rem; padding: 1.25rem; }
  .editor-preview { width: min(100%, 22rem); max-height: none; margin: 0 auto; }
  .persistent-add-more { min-height: 3.8rem; padding: .75rem; }
  .metadata-form { padding: 1rem; gap: .9rem; }
  .metadata-form input, .metadata-form select, .metadata-form textarea, .url-panel input { font-size: 16px; }
  .manage-kind select, .manage-value-input input { font-size: 16px; }
  .autocomplete-menu { position: relative; top: auto; max-height: 11rem; margin-top: .35rem; }
  .multi-value-control .autocomplete-menu { grid-column: 1 / -1; right: auto; margin-top: 0; }
  .detail-image { min-height: 52vh; max-height: 58vh; }
  .detail-copy { padding: 1.4rem; }
  .form-actions { flex-wrap: wrap; }
  .action-spacer { display: none; }
  .form-actions > * { flex: 1; white-space: nowrap; }
  .manage-lists-body { padding: 1rem; }
  .manage-value-list { max-height: none; }
  .manage-value-row { grid-template-columns: minmax(0, 1fr) auto; }
  .manage-value-input { grid-column: 1 / -1; }
  .manage-value-row .secondary-button, .delete-list-value { border-radius: .7rem; }
}

@media (max-width: 420px) {
  .brand-mark { width: 2.5rem; height: 2.5rem; }
  .brand h1 { font-size: 1.12rem; }
  .summary-row { gap: .35rem; }
  .stat span { font-size: .67rem; }
  .sort-control { flex: 1; }
  .sort-control select { width: 100%; }
  .pocket-caption small { display: none; }
  .album-pocket { aspect-ratio: .7; }
  .pocket-photo { flex: 1; aspect-ratio: auto; }
  .people-grid { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: no-preference) {
  button, .album-pocket, .person-card, .instax-card { transition: .18s ease; }
}
