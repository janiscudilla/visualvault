  font-family: 'DM Sans', system-ui, sans-serif;
  color: #f8f2ec;
  background: #120e14;
  font-synthesis: none;
  --bg: #120e14;
  --surface: #1c151f;
  --surface-2: #251c29;
  --surface-3: #2d2231;
  --border: #3a2d3e;
  --text: #f8f2ec;
  --muted: #b3a5b8;
  --faint: #766a7c;
  --gold: #e6ad58;
  --gold-soft: #f5cf8e;
  --plum: #70435c;
  --danger: #ee937d;
  --shadow: 0 24px 70px rgba(0, 0, 0, .38);
}

* { box-sizing: border-box; }

html { min-width: 320px; background: var(--bg); }

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background:
    radial-gradient(circle at 15% -10%, rgba(112, 67, 92, .22), transparent 38rem),
    radial-gradient(circle at 90% 0%, rgba(230, 173, 88, .08), transparent 28rem),
    var(--bg);
}

button, input, select, textarea { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
button:disabled { opacity: .55; cursor: not-allowed; }

.app-shell { min-height: 100vh; }
.modal-open { overflow: hidden; }

.topbar {
  position: sticky;
  z-index: 20;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1.15rem clamp(1rem, 3vw, 2.5rem);
  border-bottom: 1px solid rgba(82, 65, 87, .75);
  background: rgba(18, 14, 20, .86);
  backdrop-filter: blur(18px);
}

.brand { display: flex; align-items: center; gap: .8rem; min-width: 0; }
.brand-mark {
  display: grid;
  width: 2.8rem;
  height: 2.8rem;
  flex: 0 0 auto;
  place-items: center;
  color: #211519;
  border-radius: .8rem;
  background: linear-gradient(145deg, var(--gold-soft), var(--gold));
  box-shadow: inset 0 1px rgba(255,255,255,.5), 0 9px 24px rgba(230,173,88,.15);
}

.brand h1, .locked-screen h1, .modal h2, .empty-state h2 {
  margin: 0;
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
}
.brand h1 { font-size: clamp(1.3rem, 2.2vw, 1.75rem); line-height: 1.05; }
.brand p { margin: .25rem 0 0; color: var(--muted); font-size: .78rem; font-style: italic; }
.header-actions { display: flex; align-items: center; gap: .6rem; }

.primary-button, .secondary-button, .quiet-button, .delete-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .45rem;
  min-height: 2.6rem;
  padding: .68rem 1rem;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 700;
  font-size: .86rem;
}
.primary-button { color: #24160d; border: 1px solid #f0bf70; background: linear-gradient(180deg, #f2bd69, #dea04a); box-shadow: 0 8px 24px rgba(230,173,88,.13); }
.primary-button:hover { filter: brightness(1.05); transform: translateY(-1px); }
.secondary-button { border: 1px solid var(--border); background: var(--surface-2); }
.secondary-button:hover, .quiet-button:hover { background: var(--surface-3); }
.quiet-button { color: var(--muted); border: 1px solid var(--border); background: transparent; }
.delete-button { color: var(--danger); border: 1px solid rgba(238,147,125,.3); background: transparent; }
.icon-button {
  display: grid;
  width: 2.55rem;
  height: 2.55rem;
  padding: 0;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface-2);
  cursor: pointer;
}
.icon-button:hover { background: var(--surface-3); }
.demo-pill { padding: .4rem .7rem; border: 1px solid rgba(230,173,88,.3); border-radius: 999px; color: var(--gold-soft); background: rgba(230,173,88,.1); font-size: .75rem; }

main { width: min(1240px, calc(100% - 2rem)); margin: 0 auto; padding: 1.5rem 0 4rem; }

.summary-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(85px, 130px)) minmax(180px, 1fr);
  gap: .7rem;
  margin-bottom: 1rem;
}
.stat, .favorite-stat {
  min-height: 5rem;
  padding: .85rem 1rem;
  border: 1px solid var(--border);
  border-radius: 1rem;
  background: linear-gradient(145deg, rgba(37,28,41,.92), rgba(28,21,31,.92));
}
.stat { display: flex; flex-direction: column; justify-content: center; }
.stat strong { color: var(--gold-soft); font-family: 'Fraunces', serif; font-size: 1.55rem; font-weight: 600; line-height: 1; }
.stat span, .favorite-stat span { margin-top: .3rem; color: var(--muted); font-size: .76rem; }
.favorite-stat { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; text-align: right; }
.favorite-stat strong { margin-top: .25rem; font-family: 'Fraunces', serif; font-size: 1.05rem; }

.controls { padding: .8rem; border: 1px solid var(--border); border-radius: 1.15rem; background: rgba(28,21,31,.8); box-shadow: 0 12px 35px rgba(0,0,0,.12); }
.search-box {
  display: flex;
  align-items: center;
  gap: .65rem;
  min-height: 3rem;
  padding: 0 .9rem;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: .8rem;
  background: var(--surface-2);
}
.search-box:focus-within { border-color: rgba(230,173,88,.65); box-shadow: 0 0 0 3px rgba(230,173,88,.08); }
.search-box input { width: 100%; border: 0; outline: 0; color: var(--text); background: transparent; font-size: .95rem; }
.search-box input::placeholder { color: #8d8091; }
.search-box button { display: grid; padding: .25rem; border: 0; color: var(--muted); background: transparent; cursor: pointer; }

.control-row { display: flex; align-items: center; gap: .6rem; margin-top: .7rem; }
.filter-button, .sort-control, .view-switcher { border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); }
.filter-button { display: inline-flex; align-items: center; gap: .4rem; min-height: 2.4rem; padding: .55rem .85rem; cursor: pointer; }
.filter-button.active { border-color: rgba(230,173,88,.45); }
.filter-button b { display: grid; width: 1.25rem; height: 1.25rem; place-items: center; border-radius: 50%; color: #24160d; background: var(--gold); font-size: .7rem; }
.sort-control { display: flex; align-items: center; gap: .35rem; min-height: 2.4rem; padding: 0 .35rem 0 .75rem; color: var(--muted); }
.sort-control select, .filter-select select { border: 0; outline: 0; color: var(--text); background: transparent; cursor: pointer; }
.sort-control select { min-height: 2.2rem; padding: 0 1.3rem 0 .2rem; font-size: .82rem; }
.sort-control option, .filter-select option, .metadata-form option { color: var(--text); background: var(--surface-2); }
.view-switcher { display: flex; margin-left: auto; padding: .2rem; }
.view-switcher button { display: inline-flex; align-items: center; gap: .35rem; min-height: 2rem; padding: .42rem .7rem; border: 0; border-radius: 999px; color: var(--muted); background: transparent; cursor: pointer; font-size: .78rem; }
.view-switcher button.active { color: #24160d; background: var(--gold); }

.filter-drawer { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; align-items: end; gap: .75rem; margin-top: .8rem; padding: .85rem; border-top: 1px solid var(--border); }
.filter-select { display: grid; gap: .3rem; }
.filter-select span { color: var(--muted); font-size: .72rem; }
.filter-select select { width: 100%; min-height: 2.45rem; padding: 0 .75rem; border: 1px solid var(--border); border-radius: .65rem; background: var(--surface); }
.clear-button { min-height: 2.45rem; padding: 0 .65rem; border: 0; color: var(--gold-soft); background: transparent; cursor: pointer; font-size: .8rem; }

.results-line { display: flex; align-items: center; justify-content: space-between; min-height: 2.6rem; margin-top: .7rem; color: var(--muted); font-size: .8rem; }
.results-line button { display: inline-flex; align-items: center; gap: .3rem; padding: .35rem .6rem; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); cursor: pointer; }

.album-stack { display: grid; gap: 1.5rem; }
.binder-page {
  position: relative;
  padding: 1.65rem 1.45rem 2rem 2.7rem;
  border: 1px solid rgba(219,211,220,.16);
  border-radius: .45rem 1rem 1rem .45rem;
  background:
    linear-gradient(115deg, rgba(255,255,255,.045), transparent 28%),
    linear-gradient(160deg, rgba(217,223,225,.13), rgba(119,111,123,.045));
  box-shadow: var(--shadow), inset 0 1px rgba(255,255,255,.13);
  overflow: hidden;
}
.binder-page::after {
  content: '';
  position: absolute;
  z-index: 3;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(110deg, transparent 7%, rgba(255,255,255,.075) 29%, transparent 43%);
}
.binder-rings { position: absolute; z-index: 5; left: -.2rem; top: 16%; bottom: 16%; display: flex; flex-direction: column; justify-content: space-around; }
.binder-rings i { display: block; width: 2rem; height: .55rem; border: 2px solid #a99383; border-left: 0; border-radius: 0 999px 999px 0; background: linear-gradient(#e5d6c6, #8a776c); box-shadow: 2px 2px 5px rgba(0,0,0,.4); }
.pocket-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(.65rem, 1.5vw, 1.15rem); }
.album-pocket {
  position: relative;
  display: flex;
  min-width: 0;
  padding: clamp(.35rem, .8vw, .58rem);
  flex-direction: column;
  border: 1px solid rgba(230,226,234,.23);
  border-radius: .42rem;
  background: rgba(224,227,232,.07);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.035), 0 8px 18px rgba(0,0,0,.2);
  cursor: pointer;
  text-align: left;
  overflow: hidden;
}
.album-pocket::after { content: ''; position: absolute; z-index: 2; inset: 0; pointer-events: none; background: linear-gradient(125deg, rgba(255,255,255,.12), transparent 24%, transparent 70%, rgba(255,255,255,.04)); }
.album-pocket:hover { border-color: rgba(230,173,88,.55); transform: translateY(-2px); }
.pocket-photo { display: block; aspect-ratio: 4 / 5; border-radius: .28rem; background: #2d2231; overflow: hidden; }
.pocket-photo img, .person-portrait img, .wall-frame img, .detail-image img { width: 100%; height: 100%; object-fit: cover; }
.pocket-caption { display: grid; min-width: 0; padding: .55rem .15rem .15rem; }
.pocket-caption strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: clamp(.76rem, 1.5vw, .98rem); }
.pocket-caption small { overflow: hidden; margin-top: .1rem; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: clamp(.65rem, 1.1vw, .74rem); }
.empty-pocket { aspect-ratio: 4 / 6; cursor: default; opacity: .45; }
.empty-pocket:hover { border-color: rgba(230,226,234,.23); transform: none; }
.page-number { position: absolute; right: 1.2rem; bottom: .55rem; color: rgba(244,236,245,.4); font-family: 'Fraunces', serif; font-size: .72rem; }
.photo-placeholder { display: grid; width: 100%; height: 100%; place-items: center; color: rgba(255,245,235,.9); background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.14), transparent 35%), linear-gradient(145deg, var(--placeholder), #2b202d); }
.photo-placeholder span { font-family: 'Fraunces', serif; font-size: clamp(1.4rem, 5vw, 3.2rem); letter-spacing: .08em; }

.gallery-wall {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-auto-flow: dense;
  gap: clamp(1rem, 2vw, 1.8rem);
  padding: clamp(1.2rem, 3vw, 2.5rem);
  border: 1px solid #d2b79022;
  border-radius: .55rem;
  background: linear-gradient(110deg, rgba(255,239,210,.055), transparent), #1a151a;
  box-shadow: var(--shadow), inset 0 0 70px rgba(230,173,88,.035);
}
.wall-frame { grid-column: span 3; display: flex; padding: .55rem; flex-direction: column; border: 4px solid #9d7548; border-radius: 2px; background: linear-gradient(145deg, #ad8658, #604329); box-shadow: 0 12px 22px rgba(0,0,0,.35), inset 0 0 0 1px #d6b07c; cursor: pointer; }
.wall-frame.frame-2, .wall-frame.frame-5 { grid-column: span 4; }
.wall-frame.frame-3 { grid-column: span 5; }
.wall-frame:hover { transform: translateY(-3px) rotate(.25deg); box-shadow: 0 18px 30px rgba(0,0,0,.43); }
.frame-mat { display: block; aspect-ratio: 4 / 5; padding: .65rem; background: #e8ddcd; overflow: hidden; }
.frame-label { padding: .55rem .25rem .2rem; color: #fff4e4; font-family: 'Fraunces', serif; font-size: .85rem; }

.people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
.person-card { display: grid; grid-template-columns: 5.2rem 1fr; gap: .9rem; align-items: center; padding: .65rem; border: 1px solid var(--border); border-radius: 1rem; background: linear-gradient(145deg, var(--surface-2), var(--surface)); cursor: pointer; text-align: left; }
.person-card:hover { border-color: rgba(230,173,88,.45); transform: translateY(-2px); }
.person-portrait { display: block; width: 5.2rem; aspect-ratio: 4 / 5; border-radius: .65rem; overflow: hidden; }
.person-info { display: flex; min-width: 0; flex-direction: column; }
.person-info strong { overflow: hidden; font-family: 'Fraunces', serif; font-size: 1.08rem; text-overflow: ellipsis; white-space: nowrap; }
.person-info small { margin-top: .18rem; color: var(--muted); }
.person-info em { margin-top: .7rem; color: var(--gold-soft); font-size: .78rem; font-style: normal; }

.empty-state, .content-loading { display: grid; min-height: 24rem; place-items: center; align-content: center; text-align: center; }
.empty-state > span { display: grid; width: 4.3rem; height: 4.3rem; place-items: center; border: 1px solid rgba(230,173,88,.3); border-radius: 1.2rem; color: var(--gold); background: rgba(230,173,88,.08); }
.empty-state h2 { margin-top: 1rem; font-size: 1.5rem; }
.empty-state p { max-width: 32rem; margin: .55rem auto 1rem; color: var(--muted); }
.content-loading { gap: .6rem; color: var(--muted); }
.error-banner { margin: .8rem 0; padding: .8rem 1rem; border: 1px solid rgba(238,147,125,.3); border-radius: .8rem; color: #ffd6ce; background: rgba(238,147,125,.08); }

footer { display: flex; align-items: center; justify-content: center; gap: .35rem; padding: 1.5rem; color: var(--faint); font-size: .75rem; }

.modal-backdrop { position: fixed; z-index: 100; inset: 0; display: grid; padding: 1rem; place-items: center; background: rgba(7,5,8,.78); backdrop-filter: blur(9px); overflow-y: auto; }
.modal { width: min(900px, 100%); max-height: calc(100vh - 2rem); border: 1px solid var(--border); border-radius: 1.25rem; background: var(--surface); box-shadow: 0 35px 90px rgba(0,0,0,.65); overflow: auto; }
.modal-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1.25rem 1.35rem; border-bottom: 1px solid var(--border); }
.modal h2 { font-size: 1.65rem; }
.eyebrow { margin: 0 0 .3rem; color: var(--gold); font-size: .68rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.editor-layout { display: grid; grid-template-columns: minmax(280px, .9fr) minmax(320px, 1.1fr); }
.image-editor { padding: 1.25rem; border-right: 1px solid var(--border); background: #161118; }
.source-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: .35rem; margin-bottom: .8rem; padding: .25rem; border: 1px solid var(--border); border-radius: .8rem; background: var(--surface); }
.source-tabs button { display: flex; align-items: center; justify-content: center; gap: .4rem; min-height: 2.25rem; border: 0; border-radius: .6rem; color: var(--muted); background: transparent; cursor: pointer; }
.source-tabs button.active { color: #24160d; background: var(--gold); }
.drop-zone { display: grid; width: 100%; min-height: 23rem; padding: 2rem; place-items: center; align-content: center; gap: .45rem; border: 1px dashed #68556e; border-radius: .9rem; color: var(--muted); background: rgba(112,67,92,.08); cursor: pointer; }
.drop-zone strong { color: var(--text); }
.drop-zone span { font-size: .82rem; }
.drop-zone.dragging { border-color: var(--gold); color: var(--gold); background: rgba(230,173,88,.08); }
.url-panel { display: grid; min-height: 23rem; padding: 2rem 1rem; place-items: center; align-content: center; gap: 1rem; color: var(--muted); }
.url-panel label { display: grid; width: 100%; gap: .35rem; font-size: .78rem; }
.url-panel input { width: 100%; }
.editor-preview { position: relative; aspect-ratio: 4 / 5; max-height: 25rem; border-radius: .8rem; background: #0c090d; overflow: hidden; }
.editor-preview img { width: 100%; height: 100%; object-fit: cover; }
.editor-preview button { position: absolute; top: .65rem; right: .65rem; display: inline-flex; align-items: center; gap: .3rem; padding: .45rem .65rem; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; background: rgba(15,10,16,.76); cursor: pointer; font-size: .75rem; backdrop-filter: blur(8px); }
.focal-controls { display: grid; gap: .55rem; margin-top: .8rem; }
.focal-controls label { display: grid; grid-template-columns: 7rem 1fr; align-items: center; gap: .5rem; color: var(--muted); font-size: .7rem; }
.focal-controls input { accent-color: var(--gold); }
.metadata-form { display: flex; padding: 1.35rem; flex-direction: column; gap: 1rem; }
.metadata-form > label { display: grid; gap: .4rem; }
.metadata-form > label > span, .url-panel label span { color: var(--muted); font-size: .78rem; }
.metadata-form b { color: var(--gold); }
.metadata-form small { color: var(--faint); font-size: .7rem; }
.metadata-form input, .metadata-form select, .metadata-form textarea, .url-panel input { padding: .72rem .8rem; border: 1px solid var(--border); border-radius: .7rem; outline: 0; color: var(--text); background: var(--surface-2); font-size: .92rem; }
.metadata-form textarea { resize: vertical; line-height: 1.5; }
.metadata-form input:focus, .metadata-form select:focus, .metadata-form textarea:focus, .url-panel input:focus { border-color: rgba(230,173,88,.6); }
.form-error { margin: 0; padding: .7rem .8rem; border-radius: .6rem; color: #ffd3c9; background: rgba(238,147,125,.1); font-size: .78rem; }
.upload-progress { position: relative; height: 1.7rem; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.upload-progress span { position: absolute; inset: 0 auto 0 0; background: rgba(230,173,88,.35); }
.upload-progress small { position: relative; z-index: 1; display: grid; height: 100%; place-items: center; font-size: .7rem; }
.form-actions { display: flex; align-items: center; gap: .55rem; margin-top: auto; padding-top: .4rem; }
.action-spacer { flex: 1; }
.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.detail-modal { display: grid; grid-template-columns: minmax(280px, 1.05fr) minmax(250px, .75fr); width: min(820px, 100%); overflow: hidden; }
.detail-image { min-height: min(70vh, 670px); background: #0c090d; }
.detail-copy { position: relative; display: flex; padding: 2rem; flex-direction: column; justify-content: center; }
.detail-copy .icon-button { position: absolute; top: 1rem; right: 1rem; }
.detail-copy h2 { font-size: clamp(1.8rem, 5vw, 2.8rem); line-height: 1; }
.detail-group { margin: .55rem 0 0; color: var(--gold-soft); }
.detail-note { margin: 1.5rem 0; color: var(--muted); line-height: 1.6; }
.edit-detail { align-self: flex-start; margin-top: .5rem; }

.locked-screen { display: flex; width: min(520px, calc(100% - 2rem)); min-height: 100vh; margin: 0 auto; padding: 3rem 1rem; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.locked-folder { display: grid; width: 6.3rem; height: 6.3rem; margin-bottom: 1.35rem; place-items: center; border: 1px solid rgba(230,173,88,.36); border-radius: 1.7rem; color: var(--gold); background: linear-gradient(145deg, rgba(230,173,88,.14), rgba(112,67,92,.16)); box-shadow: 0 25px 70px rgba(0,0,0,.34); }
.locked-screen h1 { font-size: clamp(2.7rem, 10vw, 4.5rem); line-height: .95; }
.locked-screen > p:not(.eyebrow):not(.form-error) { max-width: 27rem; color: var(--muted); line-height: 1.55; }
.sign-in-button { margin-top: 1.1rem; }
.setup-card { display: grid; width: 100%; margin-top: 1rem; padding: 1rem; gap: .55rem; border: 1px solid var(--border); border-radius: 1rem; color: var(--muted); background: var(--surface); font-size: .85rem; }
.setup-card strong { color: var(--text); }
.setup-card .secondary-button { margin: .3rem auto 0; }
.uid-copy code { word-break: break-all; }
.app-loading { display: grid; min-height: 100vh; place-items: center; align-content: center; gap: .7rem; color: var(--muted); }
.toast { position: fixed; z-index: 150; right: 1rem; bottom: 1rem; max-width: min(26rem, calc(100% - 2rem)); padding: .8rem 1rem; border: 1px solid rgba(230,173,88,.34); border-radius: .8rem; color: #fff2dc; background: rgba(42,31,39,.96); box-shadow: var(--shadow); font-size: .82rem; }

@media (max-width: 760px) {
  .topbar { align-items: flex-start; }
  .brand p { display: none; }
  .header-actions { gap: .4rem; }
  .add-button { width: 2.55rem; padding: 0; }
  .add-button svg { margin: 0; }
  .add-button { font-size: 0; }
  .demo-pill, .quiet-button { display: none; }
  main { width: min(100% - 1rem, 1240px); padding-top: .75rem; }
  .summary-row { grid-template-columns: repeat(3, 1fr); gap: .45rem; }
  .stat { min-height: 4rem; padding: .65rem; }
  .stat strong { font-size: 1.25rem; }
  .favorite-stat { grid-column: 1 / -1; min-height: 3.4rem; align-items: flex-start; text-align: left; }
  .favorite-stat strong { font-size: .95rem; }
  .control-row { flex-wrap: wrap; }
  .view-switcher { width: 100%; margin: .1rem 0 0; }
  .view-switcher button { flex: 1; justify-content: center; }
  .filter-drawer { grid-template-columns: 1fr; }
  .binder-page { padding: 1rem .65rem 1.55rem 1.4rem; }
  .binder-rings { left: -.45rem; }
  .binder-rings i { width: 1.4rem; }
  .pocket-grid { gap: .38rem; }
  .album-pocket { padding: .25rem; }
  .pocket-caption { padding: .38rem .05rem .08rem; }
  .pocket-caption strong { font-size: .68rem; }
  .pocket-caption small { font-size: .58rem; }
  .empty-pocket { aspect-ratio: 4 / 6.1; }
  .gallery-wall { grid-template-columns: repeat(6, 1fr); padding: .75rem; gap: .75rem; }
  .wall-frame, .wall-frame.frame-2, .wall-frame.frame-3, .wall-frame.frame-5 { grid-column: span 3; padding: .35rem; border-width: 3px; }
  .frame-mat { padding: .35rem; }
  .frame-label { font-size: .68rem; }
  .editor-layout, .detail-modal { grid-template-columns: 1fr; }
  .image-editor { border-right: 0; border-bottom: 1px solid var(--border); }
  .drop-zone, .url-panel { min-height: 15rem; }
  .editor-preview { max-height: 19rem; }
  .detail-image { min-height: 52vh; max-height: 58vh; }
  .detail-copy { padding: 1.4rem; }
  .form-actions { flex-wrap: wrap; }
  .action-spacer { display: none; }
  .form-actions > * { flex: 1; white-space: nowrap; }
}

@media (max-width: 420px) {
  .brand-mark { width: 2.5rem; height: 2.5rem; }
  .brand h1 { font-size: 1.12rem; }
  .summary-row { gap: .35rem; }
  .stat span { font-size: .67rem; }
  .sort-control { flex: 1; }
  .sort-control select { width: 100%; }
  .pocket-caption small { display: none; }
  .album-pocket { aspect-ratio: .7; }
  .pocket-photo { flex: 1; aspect-ratio: auto; }
  .people-grid { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: no-preference) {
  button, .album-pocket, .person-card, .wall-frame { transition: .18s ease; }
}
